<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111820" />
    <meta
      name="description"
      content="Social links for TikTok, Instagram, and Facebook."
    />
    <title>Social Links</title>
    <style>
      :root {
        --night: #0d141b;
        --ink: #111a21;
        --cream: #f3ede2;
        --soft: #b5b6b0;
        --gold: #d6a66a;
        --orange: #cc7447;
        --line: rgba(243, 237, 226, 0.18);
        --photo: url("./profile.jpg");
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--night);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--cream);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          linear-gradient(120deg, rgba(10, 16, 22, 0.88), rgba(10, 16, 22, 0.55)),
          var(--photo) center / cover fixed,
          var(--night);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at 10% 12%, rgba(214, 166, 106, 0.25), transparent 26rem),
          radial-gradient(circle at 90% 88%, rgba(204, 116, 71, 0.18), transparent 25rem),
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 5px);
        content: "";
        pointer-events: none;
      }

      .page {
        display: grid;
        width: min(100% - 28px, 1080px);
        min-height: 100vh;
        margin: 0 auto;
        place-items: center;
        padding: 28px 0;
      }

      .layout {
        display: grid;
        width: 100%;
        max-width: 930px;
        grid-template-columns: minmax(250px, 0.92fr) minmax(320px, 1.08fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(11, 18, 24, 0.72);
        box-shadow:
          0 40px 110px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(18px);
      }

      .photo-panel {
        position: relative;
        min-height: 620px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(10, 15, 20, 0.02), rgba(10, 15, 20, 0.82)),
          var(--photo) center / cover;
      }

      .photo-panel::before {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(112deg, transparent 20%, rgba(214, 166, 106, 0.2) 50%, transparent 72%),
          repeating-linear-gradient(90deg, transparent 0 17px, rgba(255, 255, 255, 0.04) 18px 19px);
        content: "";
        mix-blend-mode: screen;
        opacity: 0.7;
      }

      .photo-panel::after {
        position: absolute;
        right: 24px;
        bottom: 24px;
        left: 24px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        box-shadow: 0 0 18px var(--gold);
        content: "";
      }

      .vertical-label {
        position: absolute;
        top: 28px;
        left: 24px;
        z-index: 1;
        color: rgba(243, 237, 226, 0.76);
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }

      .number {
        position: absolute;
        right: 24px;
        bottom: 37px;
        z-index: 1;
        color: rgba(243, 237, 226, 0.72);
        font-size: 0.68rem;
        letter-spacing: 0.16em;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 620px;
        padding: clamp(30px, 6vw, 64px);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 45%),
          rgba(11, 18, 24, 0.82);
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
        color: var(--gold);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .kicker::before {
        width: 27px;
        height: 1px;
        background: var(--gold);
        box-shadow: 0 0 12px var(--gold);
        content: "";
      }

      h1 {
        max-width: 360px;
        margin: 0;
        color: var(--cream);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.7rem, 6vw, 4.8rem);
        font-weight: 400;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }

      h1 em {
        display: block;
        color: var(--gold);
        font-style: italic;
      }

      .rule {
        width: min(100%, 380px);
        height: 1px;
        margin: 28px 0 24px;
        background: linear-gradient(90deg, var(--gold), rgba(214, 166, 106, 0.08));
      }

      .links {
        display: grid;
        gap: 11px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 66px;
        padding: 9px 14px 9px 10px;
        color: var(--cream);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(243, 237, 226, 0.045);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .link:hover,
      .link:focus-visible {
        border-color: rgba(214, 166, 106, 0.7);
        background: rgba(214, 166, 106, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
        outline: none;
        transform: translateX(5px);
      }

      .icon {
        display: grid;
        width: 43px;
        height: 43px;
        flex: 0 0 43px;
        place-items: center;
        border: 1px solid rgba(243, 237, 226, 0.32);
        border-radius: 11px;
        background: rgba(0, 0, 0, 0.24);
      }

      .icon svg {
        width: 21px;
        height: 21px;
        fill: var(--cream);
      }

      .copy {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .copy strong {
        font-size: 0.95rem;
        font-weight: 800;
      }

      .copy span {
        overflow: hidden;
        color: var(--soft);
        font-size: 0.76rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .arrow {
        margin-left: auto;
        color: var(--gold);
        font-size: 1.2rem;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 25px;
        color: rgba(243, 237, 226, 0.5);
        font-size: 0.67rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .footer::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 10px var(--orange);
        content: "";
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 18px, 560px);
          padding: 9px 0;
        }

        .layout {
          grid-template-columns: 1fr;
          border-radius: 20px;
        }

        .photo-panel {
          min-height: 360px;
          background-position: center 36%;
        }

        .content {
          min-height: auto;
          padding: 34px 24px 30px;
        }

        h1 {
          font-size: clamp(2.8rem, 15vw, 4.2rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="layout">
        <div class="photo-panel" aria-label="Profile photo">
          <span class="vertical-label">connect</span>
          <span class="number">01 / 03</span>
        </div>

        <div class="content">
          <p class="kicker">social links</p>
          <h1>Find me <em>online.</em></h1>
          <div class="rule"></div>

          <nav class="links" aria-label="Social links">
            <a
              class="link"
              href="https://www.tiktok.com/@janri_abela"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M15.2 3c.3 1.8 1.3 3 3.1 3.2v3a7 7 0 0 1-3.1-.8v6.2a5.4 5.4 0 1 1-4.7-5.3v3.1a2.4 2.4 0 1 0 1.6 2.2V3h3.1Z"></path>
                </svg>
              </span>
              <span class="copy">
                <strong>TikTok</strong>
                <span>@janri_abela</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              class="link"
              href="https://www.instagram.com/janri_abemaria/"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                  <circle cx="12" cy="12" r="4"></circle>
                  <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                </svg>
              </span>
              <span class="copy">
                <strong>Instagram</strong>
                <span>@janri_abemaria</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              class="link"
              href="https://www.facebook.com/johnrey.abela.16"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.5-1.5h1.7V4a22 22 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3V10H7.5v3H10v8h3.5Z"></path>
                </svg>
              </span>
              <span class="copy">
                <strong>Facebook</strong>
                <span>johnrey.abela.16</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </nav>

          <div class="footer">03 links</div>
        </div>
      </section>
    </main>
  </body>
</html>
